# Publishes the package to PyPI via trusted publishing when a GitHub release with a tag "v*" is published.
#
# One-time setup (see README, section "Releasing"):
# - GitHub environment "release" in the repository settings. If its deployment branches are restricted, add a rule of
#   type *Tag* matching "v*": a release deploys from the tag, not from a branch.
# - Trusted publisher on PyPI: project "weclapp-client", owner "Hochfrequenz", repository "weclapp_client.py",
#   workflow "python-publish.yml", environment "release".

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group tests
      - name: Run tests
        run: uv run pytest

  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    needs: tests
    # strongly recommended by PyPI for trusted publishing: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    environment: release
    permissions:
      # mandatory for trusted publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group packaging
      - name: Build wheel and source distributions
        run: uv run python -m build
      - name: Check distributions
        run: uv run twine check dist/*
      - name: Publish distributions to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
