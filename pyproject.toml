[project]
name = "weclapp-client"
description = "Typed Python client for the weclapp REST API v2, focused on employee master data"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nicola Söker", email = "nicola.soeker@hochfrequenz.de" }]
keywords = ["weclapp", "erp", "api", "client", "rest", "employee"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# lower bounds only (no pins): this is a library that is installed next to the dependencies of the sync repository
dependencies = ["httpx>=0.28", "pydantic>=2.11"]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/weclapp_client.py/releases"
Homepage = "https://github.com/Hochfrequenz/weclapp_client.py"

[dependency-groups]
tests = ["pytest==9.1.1"]
linting = [{ include-group = "tests" }, "ruff==0.16.9"]
type_check = [{ include-group = "tests" }, "mypy==2.3.1"]
spell_check = ["codespell==2.4.3"]
coverage = [{ include-group = "tests" }, "coverage==7.16.1"]
# build/twine are only needed to build & publish this package to PyPI, not by users installing it, so they live
# here rather than as a pip-installable extra.
packaging = ["build==1.6.1", "twine==7.0.0"]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
    "pre-commit",
]

[tool.uv]
# don't auto-include the "dev" group in every `uv sync`/`uv run` invocation, so that CI jobs can pull in just the
# one group they need (e.g. `uv run --group linting ...`) without also installing every other tool.
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["unittests"]
markers = [
    "integration: runs against a real weclapp tenant, needs WECLAPP_BASE_URL and WECLAPP_API_TOKEN",
]

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

# the version is derived from git tags; at runtime it is read via importlib.metadata (see weclapp_client/__init__.py)
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
